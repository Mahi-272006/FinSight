# Pytest configuration for FinSight backend.
#
# asyncio_mode = "auto": async test functions run without needing an explicit
# @pytest.mark.asyncio decorator on every test. We use async tests for the LLM
# manager (M5) and the research graph (M6) because LangChain/LangGraph tool
# execution is async.

[pytest]
testpaths = tests
asyncio_mode = auto
addopts = -ra
filterwarnings =
    # google-api-core warns that Python 3.10 is no longer supported by Google
    # libraries. Known issue, tracked in IMPLEMENTATION_LOG (affects Gemini
    # fallback only). Silence the noise here; revisit in M5.
    ignore:You are using a non-supported Python version:FutureWarning
